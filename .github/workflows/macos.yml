name: Build (macOS)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Compile C wrapper
        run: |
          # Build a fat static library for macOS arm64 + x86_64
          clang -arch arm64 -c -Isrc/nativeInterop/cinterop src/nativeInterop/cinterop/libc_wrapper.c -o src/nativeInterop/cinterop/wrapper_arm64.o
          clang -arch x86_64 -c -Isrc/nativeInterop/cinterop src/nativeInterop/cinterop/libc_wrapper.c -o src/nativeInterop/cinterop/wrapper_x64.o
          lipo -create src/nativeInterop/cinterop/wrapper_arm64.o src/nativeInterop/cinterop/wrapper_x64.o -output src/nativeInterop/cinterop/libc_wrapper.o
          ar rcs src/nativeInterop/cinterop/libc_wrapper.a src/nativeInterop/cinterop/libc_wrapper.o
        
      - name: Build and test macOS targets
        run: >
          ./gradlew
          compileKotlinMacosArm64
          macosArm64Test
          --no-configuration-cache

      - name: Upload test reports (macOS)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
