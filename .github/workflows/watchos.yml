name: Build (watchOS)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (watchOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Compile C wrapper
        run: |
          # Build a fat static library covering all Apple architectures that
          # cinterop may link for: macOS (host), watchOS device, watchOS simulator.
          
          # macOS arm64 (host + macOS target)
          clang -arch arm64 -c -Isrc/nativeInterop/cinterop src/nativeInterop/cinterop/libc_wrapper.c -o src/nativeInterop/cinterop/wrapper_macos_arm64.o
          
          # macOS x86_64
          clang -arch x86_64 -c -Isrc/nativeInterop/cinterop src/nativeInterop/cinterop/libc_wrapper.c -o src/nativeInterop/cinterop/wrapper_macos_x64.o
          
          # watchOS device arm64
          xcrun --sdk watchos clang -arch arm64 -c -Isrc/nativeInterop/cinterop src/nativeInterop/cinterop/libc_wrapper.c -o src/nativeInterop/cinterop/wrapper_watchos_device_arm64.o
          
          # watchOS simulator arm64
          xcrun --sdk watchsimulator clang -arch arm64 -c -Isrc/nativeInterop/cinterop src/nativeInterop/cinterop/libc_wrapper.c -o src/nativeInterop/cinterop/wrapper_watchos_sim_arm64.o
          
          # Create fat object covering all archs
          lipo -create \
            src/nativeInterop/cinterop/wrapper_macos_arm64.o \
            src/nativeInterop/cinterop/wrapper_macos_x64.o \
            src/nativeInterop/cinterop/wrapper_watchos_device_arm64.o \
            src/nativeInterop/cinterop/wrapper_watchos_sim_arm64.o \
            -output src/nativeInterop/cinterop/libc_wrapper.o
          
          ar rcs src/nativeInterop/cinterop/libc_wrapper.a src/nativeInterop/cinterop/libc_wrapper.o
        
      - name: Build and test watchOS targets
        run: >
          ./gradlew
          compileKotlinWatchosArm64
          compileKotlinWatchosDeviceArm64
          compileKotlinWatchosSimulatorArm64
          watchosSimulatorArm64Test
          --no-configuration-cache

      - name: Upload test reports (watchOS)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-watchos
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
