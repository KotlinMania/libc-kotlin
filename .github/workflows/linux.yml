name: Build (Linux)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Linux)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: LinuxX64
            test: linuxX64Test
          - runner: ubuntu-24.04-arm
            target: LinuxArm64
            test: linuxArm64Test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Compile C wrapper
        run: |
          clang -c -Isrc/nativeInterop/cinterop src/nativeInterop/cinterop/libc_wrapper.c -o src/nativeInterop/cinterop/libc_wrapper.o
          ar rcs src/nativeInterop/cinterop/libc_wrapper.a src/nativeInterop/cinterop/libc_wrapper.o
        
      - name: Build and test Linux targets
        run: >
          ./gradlew
          compileKotlin${{ matrix.target }}
          ${{ matrix.test }}
          --no-configuration-cache

      - name: Upload test reports (Linux)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.target }}
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
