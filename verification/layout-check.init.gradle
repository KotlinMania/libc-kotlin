gradle.projectsEvaluated {
    def root = gradle.rootProject
    def kmp = root.extensions.findByName("kotlin")
    if (kmp == null) return
    def targets = kmp.targets.collect { it.name }.sort()
    def expected = ["metadata", "jvm", "android", "js", "wasmJs", "wasmWasi", "macosArm64", "iosArm64", "iosSimulatorArm64", "tvosArm64", "tvosSimulatorArm64", "watchosDeviceArm64", "watchosSimulatorArm64", "linuxArm64", "linuxX64", "mingwX64", "androidNativeArm64", "androidNativeX64"].sort()
    assert targets == expected : "Target mismatch: ${targets}"
    def sourceSets = kmp.sourceSets.collectEntries { [(it.name): it.kotlin.srcDirs.collect { f -> root.relativePath(f) }] }
    assert sourceSets.androidMain == ["src/android/jvm/androidMain/kotlin"]
    assert sourceSets.jvmMain == ["src/jvm/jvmMain/kotlin"]
    assert sourceSets.jsMain == ["src/js/jsMain/kotlin"]
    assert sourceSets.nativeMain == ["src/native/nativeMain/kotlin"]
    assert sourceSets.commonMain == ["src/common/commonMain/kotlin"]
    sourceSets.each { name, dirs ->
        assert dirs.every { it.startsWith("src/") || it.startsWith("build/") } : "Unexpected ${name}: ${dirs}"
    }
    println("LAYOUT CHECK PASSED: ${targets.size()} targets, ${sourceSets.size()} source sets; Android, JVM, JS, native and common roots verified.")
}
